name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: Publish a release from the current main commit
        required: true
        type: boolean

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm == true)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve release commit
        id: commit
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            release_sha="$WORKFLOW_RUN_SHA"
          else
            release_sha="$GITHUB_SHA"
          fi
          git checkout --detach "$release_sha"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Verify manual dispatch passed CI
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          conclusion="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&status=completed&per_page=20" \
            --jq '.workflow_runs[] | select(.head_sha == env.RELEASE_SHA) | .conclusion' | head -n 1)"
          if [[ "$conclusion" != "success" ]]; then
            echo "CI has not passed for $RELEASE_SHA; refusing to release."
            exit 1
          fi

      - name: Resolve version range
        id: range
        run: |
          latest_tag="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          if [[ -n "$latest_tag" ]]; then
            base_version="${latest_tag#v}"
            range="$latest_tag..HEAD"
          else
            base_version="$(tr -d '[:space:]' < VERSION)"
            range="HEAD"
          fi
          echo "base_version=$base_version" >> "$GITHUB_OUTPUT"
          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Calculate next version
        id: version
        env:
          BASE_VERSION: ${{ steps.range.outputs.base_version }}
          VERSION_RANGE: ${{ steps.range.outputs.range }}
        run: |
          next_version="$(git log --format='%s' "$VERSION_RANGE" | bun scripts/release-version.ts --current "$BASE_VERSION")"
          if [[ "$next_version" == "$BASE_VERSION" ]]; then
            echo "No releasable commits found after $BASE_VERSION."
            exit 0
          fi
          echo "version=$next_version" >> "$GITHUB_OUTPUT"
          echo "Release version: $next_version"

      - name: Check for an existing release
        if: steps.version.outputs.version != ''
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$RELEASE_VERSION already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create annotated tag
        if: steps.version.outputs.version != '' && steps.existing.outputs.exists != 'true'
        env:
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$RELEASE_VERSION"
          if ! git rev-parse --verify --quiet "refs/tags/$tag"; then
            git tag --annotate "$tag" --message "Release $tag" "$RELEASE_SHA"
            git push origin "$tag"

      - name: Create GitHub Release
        if: steps.version.outputs.version != '' && steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "DocGen v$RELEASE_VERSION" \
            --generate-notes
          fi
