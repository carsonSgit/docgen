name: Feature request
description: Suggest an improvement that fits DocGen's scope
title: "feat: "
labels:
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        DocGen is intentionally a single-user, local-first document playground. Please explain how the proposal fits that boundary.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or limitation would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior or solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches or workarounds have you tried?
